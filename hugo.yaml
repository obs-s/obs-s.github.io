baseURL: "https://obs-s.github.io/"
locale: "en-US"
defaultContentLanguage: "en"
title: "obs-s"
theme: PaperMod

enableRobotsTXT: true
enableEmoji: true

pagination:
  pagerSize: 10

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  author: obs-s
  description: "obs-s blog"
  defaultTheme: auto
  ShowReadingTime: false
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowToc: true
  comments: true
  dateFormat: "2006-01-02"

  mainSections:
    - posts
  blogAvatar: "https://github.com/obs-s.png?size=480"

  giscus:
    repo: "obs-s/obs-s.github.io"
    repoID: "R_kgDOVCE1ew"
    category: "Announcements"
    categoryID: "DIC_kwDOVCE1e84DHacq"
    mapping: "pathname"
    strict: "1"
    reactionsEnabled: "1"
    emitMetadata: "0"
    inputPosition: "bottom"
    theme: "preferred_color_scheme"
    lang: "zh-CN"
    loading: "lazy"
    crossorigin: "anonymous"

  assets:
    favicon: "https://github.com/obs-s.png?size=64"
    favicon16x16: "https://github.com/obs-s.png?size=16"
    favicon32x32: "https://github.com/obs-s.png?size=32"
    apple_touch_icon: "https://github.com/obs-s.png?size=180"
    safari_pinned_tab: "/safari-pinned-tab.svg"

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
