baseURL: "https://johnny-son.github.io/"
locale: "en-US"
defaultContentLanguage: "en"
title: "Johnny Son"
theme: PaperMod

enableRobotsTXT: true
enableEmoji: true

pagination:
  pagerSize: 10

outputs:
  home:
    - HTML
    - RSS
    - JSON

menu:
  main:
    - name: About
      url: /about/
      weight: 10
    - name: Posts
      url: /archives/
      weight: 20
    - name: Friends
      url: /friends/
      weight: 30

params:
  env: production
  author: Johnny Son
  description: "Johnny Son 的个人网站"
  defaultTheme: auto
  ShowReadingTime: false
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  comments: true
  dateFormat: "2006-01-02"

  profileMode:
    enabled: true
    title: "Johnny Son"
    subtitle: "Curious by nature, building by choice"
    imageUrl: "https://github.com/Johnny-son.png?size=360"
    imageTitle: "Johnny Son"
    imageWidth: 180
    imageHeight: 180

  socialIcons:
    - name: github
      url: "https://github.com/Johnny-son"
    - name: gitee
      url: "https://gitee.com/qx-0"

  giscus:
    repo: "Johnny-son/Johnny-son.github.io"
    repoID: "R_kgDOT-Id6A"
    category: "Announcements"
    categoryID: "DIC_kwDOT-Id6M4DDxWn"
    mapping: "pathname"
    strict: "0"
    reactionsEnabled: "1"
    emitMetadata: "0"
    inputPosition: "bottom"
    theme: "preferred_color_scheme"
    lang: "en"
    loading: "lazy"
    crossorigin: "anonymous"

  assets:
    favicon: "https://github.com/Johnny-son.png?size=64"

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
